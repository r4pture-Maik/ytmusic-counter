<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0033" />
      <stop offset="100%" stop-color="#99001f" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="#0f0f0f" />
  <rect x="4" y="4" width="88" height="88" rx="24" fill="url(#innerGlow)" stroke="#ff0033" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Ring -->
  <circle cx="48" cy="48" r="32" fill="none" stroke="url(#bgGrad)" stroke-width="4" stroke-dasharray="160 40" stroke-linecap="round" />

  <!-- Center Core -->
  <circle cx="48" cy="48" r="18" fill="url(#bgGrad)" />

  <!-- Play Symbol / Counter Mark -->
  <polygon points="44,40 56,48 44,56" fill="#ffffff" />

  <!-- Mini Counter Badge / Dots -->
  <circle cx="72" cy="24" r="7" fill="#ff0033" stroke="#0f0f0f" stroke-width="2" />
  <text x="72" y="27.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">#</text>
</svg>
