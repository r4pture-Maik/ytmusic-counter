<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YTMusic Counter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
            <polygon points="10,8 16,12 10,16" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>YTMusic Counter</h1>
          <span class="version">v1.1.0</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="openDetailsBtn" class="btn-icon" title="Open Stats &amp; Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </button>
        <button id="resetAllBtn" class="btn-icon" title="Reset Stats">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Counter Hero -->
    <section class="stat-hero">
      <div class="counter-label">Total Plays</div>
      <div class="counter-value" id="totalPlays">0</div>
      <div class="stat-pills">
        <div class="pill">
          <span class="pill-value" id="uniqueSongs">0</span>
          <span class="pill-label">Songs</span>
        </div>
        <div class="pill">
          <span class="pill-value" id="uniqueArtists">0</span>
          <span class="pill-label">Artists</span>
        </div>
        <div class="pill">
          <span class="pill-value" id="uniqueAlbums">0</span>
          <span class="pill-label">Albums</span>
        </div>
        <div class="pill">
          <span class="pill-value" id="completedAlbums">0</span>
          <span class="pill-label">Full</span>
        </div>
      </div>
    </section>

    <!-- Now Playing Card -->
    <section class="card now-playing" id="nowPlayingCard">
      <div class="card-header">
        <span class="card-title">Now Playing</span>
        <span class="song-plays-badge" id="currentSongPlaysBadge">0 plays</span>
      </div>
      <div class="track-details">
        <div class="track-title" id="currentTrackTitle">No track playing</div>
        <div class="track-artist" id="currentTrackArtist">Open music.youtube.com</div>
      </div>
    </section>

    <!-- Grouped Counters Section (Songs, Artists, Albums) -->
    <section class="card grouped-section">
      <!-- Tabs -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="songsTab">Top Songs</button>
        <button class="tab-btn" data-tab="artistsTab">Top Artists</button>
        <button class="tab-btn" data-tab="albumsTab">Top Albums</button>
      </div>

      <!-- Tab Contents -->
      <div class="tab-content active" id="songsTab">
        <ul class="ranked-list" id="topSongsList">
          <li class="empty-state">No songs tracked yet.</li>
        </ul>
      </div>

      <div class="tab-content" id="artistsTab">
        <ul class="ranked-list" id="topArtistsList">
          <li class="empty-state">No artists tracked yet.</li>
        </ul>
      </div>

      <div class="tab-content" id="albumsTab">
        <ul class="ranked-list" id="topAlbumsList">
          <li class="empty-state">No completed albums yet.</li>
        </ul>
      </div>
    </section>

    <!-- Footer Actions -->
    <footer class="footer">
      <button id="openDetailsFooterBtn" class="btn-secondary-action">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 20V10M12 20V4M6 20v-6"/>
        </svg>
        Overview
      </button>
      <button id="openYtMusicBtn" class="btn-primary">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        Open YT Music
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
